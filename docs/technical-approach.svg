<svg width="1600" height="980" viewBox="0 0 1600 980" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">AgriRaksha Technical Approach</title>
  <desc id="desc">Technical architecture diagram for AgriRaksha crop health intelligence system.</desc>

  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f6fbf3"/>
      <stop offset="100%" stop-color="#eef4ff"/>
    </linearGradient>
    <linearGradient id="primary" x1="0" x2="1">
      <stop offset="0%" stop-color="#1e7a4b"/>
      <stop offset="100%" stop-color="#2bb673"/>
    </linearGradient>
    <linearGradient id="secondary" x1="0" x2="1">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="warning" x1="0" x2="1">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 700 30px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 600 18px 'Segoe UI', Arial, sans-serif; fill: #334155; }
      .box-title { font: 700 20px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .node-text { font: 600 15px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .small { font: 500 13px 'Segoe UI', Arial, sans-serif; fill: #475569; }
      .section { font: 700 21px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .label { font: 600 14px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .arrow { stroke: #475569; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .thin-arrow { stroke: #64748b; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; filter: url(#shadow); }
      .green { fill: #ecfdf5; stroke: #34d399; stroke-width: 2; }
      .blue { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; }
      .amber { fill: #fff7ed; stroke: #fbbf24; stroke-width: 2; }
      .slate { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 2; }
      .purple { fill: #f5f3ff; stroke: #a78bfa; stroke-width: 2; }
      .rose { fill: #fff1f2; stroke: #fda4af; stroke-width: 2; }
      .dark { fill: #0f172a; }
    </style>
  </defs>

  <rect width="1600" height="980" fill="url(#bg)"/>

  <text x="800" y="62" text-anchor="middle" class="title">AgriRaksha: Technical Approach</text>
  <text x="800" y="92" text-anchor="middle" class="subtitle">Multimodal Crop Health Intelligence Platform for Early Disease and Pest Risk Detection</text>

  <rect x="80" y="140" width="230" height="700" rx="22" class="card slate"/>
  <text x="195" y="182" text-anchor="middle" class="section">1. Data Sources</text>

  <rect x="110" y="215" width="170" height="110" rx="16" class="card green"/>
  <text x="195" y="245" text-anchor="middle" class="box-title">Farmer Inputs</text>
  <text x="195" y="272" text-anchor="middle" class="node-text">Leaf Images</text>
  <text x="195" y="294" text-anchor="middle" class="small">Geo-location</text>
  <text x="195" y="312" text-anchor="middle" class="small">Crop stage / variety</text>

  <rect x="110" y="350" width="170" height="110" rx="16" class="card blue"/>
  <text x="195" y="380" text-anchor="middle" class="box-title">Weather</text>
  <text x="195" y="407" text-anchor="middle" class="node-text">Temp, RH, Rain</text>
  <text x="195" y="429" text-anchor="middle" class="small">Leaf wetness</text>
  <text x="195" y="447" text-anchor="middle" class="small">Microclimate data</text>

  <rect x="110" y="485" width="170" height="110" rx="16" class="card amber"/>
  <text x="195" y="515" text-anchor="middle" class="box-title">Pest Surveillance</text>
  <text x="195" y="542" text-anchor="middle" class="node-text">Trap Images</text>
  <text x="195" y="564" text-anchor="middle" class="small">ETL thresholds</text>
  <text x="195" y="582" text-anchor="middle" class="small">Vector pressure</text>

  <rect x="110" y="620" width="170" height="110" rx="16" class="card purple"/>
  <text x="195" y="650" text-anchor="middle" class="box-title">Historical Signals</text>
  <text x="195" y="677" text-anchor="middle" class="node-text">Outbreak history</text>
  <text x="195" y="699" text-anchor="middle" class="small">Hotspot clusters</text>
  <text x="195" y="717" text-anchor="middle" class="small">Expert labels</text>

  <line x1="310" y1="270" x2="420" y2="270" class="arrow"/>
  <line x1="310" y1="405" x2="420" y2="405" class="arrow"/>
  <line x1="310" y1="540" x2="420" y2="540" class="arrow"/>
  <line x1="310" y1="675" x2="420" y2="675" class="arrow"/>

  <rect x="420" y="140" width="270" height="700" rx="22" class="card slate"/>
  <text x="555" y="182" text-anchor="middle" class="section">2. Intelligence Pipelines</text>

  <rect x="455" y="220" width="200" height="100" rx="16" class="card green"/>
  <text x="555" y="255" text-anchor="middle" class="box-title">Disease Vision</text>
  <text x="555" y="282" text-anchor="middle" class="small">Leaf symptom extraction</text>
  <text x="555" y="300" text-anchor="middle" class="small">Severity estimation</text>

  <rect x="455" y="355" width="200" height="100" rx="16" class="card blue"/>
  <text x="555" y="390" text-anchor="middle" class="box-title">Weather Risk</text>
  <text x="555" y="417" text-anchor="middle" class="small">Humidity + rainfall</text>
  <text x="555" y="435" text-anchor="middle" class="small">Risk rule matrices</text>

  <rect x="455" y="490" width="200" height="100" rx="16" class="card amber"/>
  <text x="555" y="525" text-anchor="middle" class="box-title">Pest Engine</text>
  <text x="555" y="552" text-anchor="middle" class="small">Trap counting</text>
  <text x="555" y="570" text-anchor="middle" class="small">ETL anomaly tracking</text>

  <rect x="455" y="625" width="200" height="100" rx="16" class="card purple"/>
  <text x="555" y="660" text-anchor="middle" class="box-title">Geo Risk</text>
  <text x="555" y="687" text-anchor="middle" class="small">Haversine clustering</text>
  <text x="555" y="705" text-anchor="middle" class="small">5 km outbreak buffer</text>

  <line x1="690" y1="270" x2="835" y2="270" class="arrow"/>
  <line x1="690" y1="405" x2="835" y2="405" class="arrow"/>
  <line x1="690" y1="540" x2="835" y2="540" class="arrow"/>
  <line x1="690" y1="675" x2="835" y2="675" class="arrow"/>

  <rect x="835" y="140" width="310" height="700" rx="22" class="card slate"/>
  <text x="990" y="182" text-anchor="middle" class="section">3. Multimodal Fusion</text>

  <rect x="875" y="245" width="230" height="160" rx="20" class="card green"/>
  <text x="990" y="280" text-anchor="middle" class="box-title">Weighted Risk Engine</text>
  <text x="990" y="318" text-anchor="middle" class="node-text">R = wvis Svis + wwx Swx</text>
  <text x="990" y="342" text-anchor="middle" class="small">+ wcrop Scrop + wgeo Sgeo</text>
  <text x="990" y="366" text-anchor="middle" class="small">+ wpest Spest</text>
  <text x="990" y="390" text-anchor="middle" class="small">Score range: 0–100</text>

  <rect x="875" y="440" width="230" height="110" rx="20" class="card blue"/>
  <text x="990" y="475" text-anchor="middle" class="box-title">Explainable AI</text>
  <text x="990" y="502" text-anchor="middle" class="small">Shows factor attribution</text>
  <text x="990" y="521" text-anchor="middle" class="small">Humidity, severity, proximity</text>

  <rect x="875" y="575" width="230" height="120" rx="20" class="card amber"/>
  <text x="990" y="610" text-anchor="middle" class="box-title">Uncertainty Guard</text>
  <text x="990" y="638" text-anchor="middle" class="small">Flags low confidence</text>
  <text x="990" y="657" text-anchor="middle" class="small">Needs expert validation</text>
  <text x="990" y="676" text-anchor="middle" class="small">Prevents false certainty</text>

  <line x1="1145" y1="270" x2="1260" y2="270" class="arrow"/>
  <line x1="1145" y1="490" x2="1260" y2="490" class="arrow"/>
  <line x1="1145" y1="635" x2="1260" y2="635" class="arrow"/>

  <rect x="1260" y="140" width="260" height="700" rx="22" class="card slate"/>
  <text x="1390" y="182" text-anchor="middle" class="section">4. Decisions &amp; Actions</text>

  <rect x="1290" y="220" width="200" height="110" rx="16" class="card green"/>
  <text x="1390" y="250" text-anchor="middle" class="box-title">Expert Review</text>
  <text x="1390" y="278" text-anchor="middle" class="small">Agronomist triage</text>
  <text x="1390" y="297" text-anchor="middle" class="small">Ground-truth validation</text>

  <rect x="1290" y="355" width="200" height="110" rx="16" class="card blue"/>
  <text x="1390" y="385" text-anchor="middle" class="box-title">IPM Advisory</text>
  <text x="1390" y="412" text-anchor="middle" class="small">Cultural + biological</text>
  <text x="1390" y="431" text-anchor="middle" class="small">Regulated chemical guidance</text>

  <rect x="1290" y="490" width="200" height="110" rx="16" class="card amber"/>
  <text x="1390" y="520" text-anchor="middle" class="box-title">Multilingual Output</text>
  <text x="1390" y="547" text-anchor="middle" class="small">English / Hindi / Telugu</text>
  <text x="1390" y="566" text-anchor="middle" class="small">Farmer-friendly advice</text>

  <rect x="1290" y="625" width="200" height="110" rx="16" class="card purple"/>
  <text x="1390" y="655" text-anchor="middle" class="box-title">GIS Hotspots</text>
  <text x="1390" y="682" text-anchor="middle" class="small">Leaflet map overlays</text>
  <text x="1390" y="701" text-anchor="middle" class="small">Containment &amp; monitoring</text>

  <text x="800" y="900" text-anchor="middle" class="subtitle">Pipeline: Data Ingestion → Multi-signal Intelligence → Risk Fusion → Human Validation → Actionable Advisory</text>
</svg>
